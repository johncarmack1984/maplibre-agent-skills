name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump level (auto uses the level recorded from merged PRs)'
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cut the release
        id: release
        env:
          LEVEL: ${{ inputs.level }}
        run: echo "version=$(node scripts/cut-release.js --level "$LEVEL")" >> "$GITHUB_OUTPUT"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add CHANGELOG.md package.json package-lock.json README.md
          git commit -m "chore(release): v${VERSION}"
          git push origin "$BRANCH"
          node scripts/release-pr-body.js "$VERSION" > "$RUNNER_TEMP/pr-body.md"
          gh pr create --title "chore(release): v${VERSION}" --body-file "$RUNNER_TEMP/pr-body.md"
