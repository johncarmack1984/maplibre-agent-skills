# v6 baseline sweep — gates the v6 migration skill's content.
#
# Not a skill eval: no SKILL.md is injected (defaultTest.vars.injectSkill: false,
# always). This probes the raw generator's pre-v6 training-data defaults against
# maplibre-gl-js v6 (released 2026-07-22). Only sections that trace to a
# confirmed baseline failure earn a place in the skill; a candidate that passes
# at baseline gets CUT, not written up.
#
# Run k=5 samples per prompt, generator only, no grader:
#   npm run eval -- --config evals/prompts/v6-baseline-sweep.yaml \
#     --repeat 5 --delay 2000 --no-cache -j 1 \
#     --output evals/results/v6-baseline-sweep.csv
#
# Budget: 12 prompts x 5 = 60 generator calls. Run it in one quiet window and do
# NOT wrap it in an outer retry loop — promptfoo already retries ~4x, and an outer
# loop compounds into a retry storm against the provider's per-minute token cap.
#
# IMPORTANT: never pass --providers on the CLI. It replaces the pinned generator
# below and silently drops its config (temperature, max_tokens).
#
# ---------------------------------------------------------------------------
# ASSERTION TRUST TIERS — read this before believing any verdict from this file.
#
# Every test is tagged in its comment with one of:
#
#   [deterministic]     The assertion tracks the defect closely enough to trust
#                       the tally directly. Still spot-check, but a FAIL here is
#                       very likely a real FAIL.
#
#   [read-behind]       The assertion can fire the wrong way on a CORRECT answer,
#                       because a model that knows the change often quotes the
#                       broken pattern while explaining that it is broken. A FAIL
#                       on these MUST be confirmed by reading the raw completion
#                       before it counts toward fail^k. Do not report a number
#                       from these without saying it was hand-confirmed.
#
#   [cleared]           Already passed at baseline in a prior k=5 run, so it is
#                       cut from skill scope. Retained deliberately as a
#                       re-runnable baseline probe: when a new model ships, a
#                       cleared item is a thinning candidate to re-check, and
#                       that only works if the probe still exists.
#
# Two assertions in the first version of this file produced FALSE PASSES that were
# caught only by reading raw output: a loose "module" match cleared an answer whose
# actual guidance was a v5 script tag, and an exact-string import check was evaded
# by the same default import written against a CDN specifier. Both are tightened
# below. That is the standing reason for the tiers.
# ---------------------------------------------------------------------------

description: v6 baseline sweep — raw generator vs. maplibre-gl-js v6 breaking changes

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - id: groq:openai/gpt-oss-120b
    label: groq-gpt-oss
    config:
      temperature: 0
      max_tokens: 8192

evaluateOptions:
  delay: 2000

defaultTest:
  vars:
    injectSkill: false

tests:
  # =========================================================================
  # Item 1 — ESM-only. UMD and the CSP bundle are gone; a browser script tag
  # must be type="module" against dist/maplibre-gl.mjs.
  # Confirmed fail^5 in the 2026-08-21 run. In skill scope.
  # =========================================================================

  # [deterministic] Requires the literal tag opening, not a stray mention of the
  # word "module". Also trips on the dead UMD path and on an unpinned specifier —
  # neither string can appear in a correct answer to this prompt.
  - description: 'item1a — CDN script tag, no bundler'
    vars:
      prompt:
        'Show me the simplest way to add a MapLibre GL JS map to a plain HTML
        page using a CDN, no build tools or npm.'
    assert:
      - type: icontains
        value: '<script type="module"'
      - type: not-icontains
        value: '/dist/maplibre-gl.js'
      - type: not-icontains
        value: 'maplibre-gl@latest'

  # [deterministic] No dead-path tripwire here: the prompt itself quotes the v5
  # script tag, and a correct answer legitimately echoes it back while saying to
  # replace it. Only the positive assertion is safe on this one.
  - description: 'item1b — is my old CDN script tag still current'
    vars:
      prompt:
        'I have this in my HTML: `<script
        src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>`. Is
        this still the right way to load the latest MapLibre GL JS, or has
        anything changed?'
    assert:
      - type: icontains
        value: '<script type="module"'

  # =========================================================================
  # Item 2 — the default export is gone. Named or namespace imports only.
  # Confirmed fail^5 in the 2026-08-21 run. In skill scope.
  # =========================================================================

  # [deterministic] Regex, not an exact string: the previous exact-string version
  # was evaded by the identical defect written against a CDN URL specifier. This
  # catches the default import regardless of what it imports from. Safe against
  # before/after answers, because a "before" block in a Mapbox-conversion answer
  # says mapboxgl, not maplibregl.
  - description: 'item2a — minimal ESM import snippet'
    vars:
      prompt:
        'Write a minimal ES module snippet that imports maplibre-gl and creates
        a Map on #map.'
    assert:
      - type: not-regex
        value: 'import\s+maplibregl\s+from\s+'

  - description: 'item2b — convert Mapbox import to MapLibre'
    vars:
      prompt:
        "Convert this Mapbox snippet to MapLibre GL JS: `import mapboxgl from
        'mapbox-gl';`"
    assert:
      - type: not-regex
        value: 'import\s+maplibregl\s+from\s+'

  # =========================================================================
  # Item 3 — nested GeoJSON properties are real objects in v6, not JSON strings,
  # so JSON.parse on a feature property is now wrong.
  # CLEARED at baseline 2026-08-21 (passed at least once in k=5). CUT from skill
  # scope. Retained as a re-runnable probe only — see the [cleared] tier note.
  # =========================================================================

  # [cleared]
  - description: 'item3a — nested property in a click handler'
    vars:
      prompt:
        'In a MapLibre GL JS map click handler, `e.features[0].properties.info`
        holds a nested object with several fields. How do I read it safely in
        JavaScript?'
    assert:
      - type: not-icontains
        value: 'JSON.parse'

  # [cleared]
  - description: 'item3b — nested property from queryRenderedFeatures'
    vars:
      prompt:
        "`map.queryRenderedFeatures()` gives me a features array where one
        properties field is a nested object (not a flat string or number).
        What's the correct way to read that field?"
    assert:
      - type: not-icontains
        value: 'JSON.parse'

  # =========================================================================
  # Item 4 — styleimagemissing is notify-only in v6. Supplying an image from
  # inside the handler no longer resolves the request; use
  # Map.setMissingStyleImageResolver.
  # Confirmed fail^5 in the 2026-08-21 run. In skill scope.
  # Assertions deliberately UNCHANGED from that run so the result stays
  # comparable across the two sweeps.
  # =========================================================================

  # [deterministic]
  - description: 'item4a — supply a missing sprite icon dynamically'
    vars:
      prompt:
        "How do I dynamically supply an icon at runtime when MapLibre GL JS
        can't find it in the style's sprite?"
    assert:
      - type: icontains
        value: 'setMissingStyleImageResolver'

  # [deterministic]
  - description: 'item4b — modern mechanism for missing icons'
    vars:
      prompt:
        "My style references icon-image names that aren't in my sprite sheet.
        What's the current, idiomatic MapLibre GL JS mechanism for generating
        those images on demand?"
    assert:
      - type: icontains
        value: 'setMissingStyleImageResolver'

  # [deterministic]
  - description: 'item4c — handle missing icon via the event system'
    vars:
      prompt:
        "Handle the case where an icon is requested by a MapLibre GL JS style
        but not present, using the map's event system."
    assert:
      - type: icontains
        value: 'setMissingStyleImageResolver'

  # =========================================================================
  # Item 5 — CommonJS. package.json's exports field has an "import" condition
  # and no "require" condition, so require('maplibre-gl') throws
  # ERR_PACKAGE_PATH_NOT_EXPORTED in Node with no bundler involved.
  # NEW candidate, never swept. Not in skill scope until it fails^5.
  # =========================================================================

  # [read-behind] The prompt asks for code rather than an explanation, to bias a
  # v6-unaware model toward emitting the require() call as its answer. The
  # assertion still cannot distinguish that from a correct answer that shows the
  # call inside a "this no longer works" block. Confirm every FAIL by hand.
  - description: 'item5a — load maplibre-gl from a CommonJS Node script'
    vars:
      prompt:
        'Write a Node.js script using CommonJS that loads the maplibre-gl
        package and prints its version.'
    assert:
      - type: not-regex
        value: '=\s*require\(\s*.maplibre-gl'

  # [read-behind] Same caveat.
  - description: 'item5b — require() fails, why'
    vars:
      prompt:
        "In Node, `require('maplibre-gl')` throws. What's the current supported
        way to load the package outside a bundler?"
    assert:
      - type: icontains
        value: 'import'

  # =========================================================================
  # Item 6 — map.transform was removed in v6 (Map composes a Camera instead of
  # extending it). Public API is the replacement.
  # NEW candidate, never swept. Not in skill scope until it fails^5.
  # =========================================================================

  # [read-behind] A v6-aware answer very likely names map.transform while saying
  # it was removed, which trips this assertion the wrong way. Treat a FAIL as
  # unconfirmed until the raw completion is read.
  - description: 'item6a — read camera state for custom math'
    vars:
      prompt:
        'In MapLibre GL JS, I need the map camera state (center, zoom, bearing,
        pitch, and the projection matrix) to do some custom math. Show me how to
        read it.'
    assert:
      - type: not-icontains
        value: 'map.transform'

  # =========================================================================
  # NOT IN THIS FILE, deliberately:
  #
  # - WebGL1 removal. Not a code migration — nothing in consumer source changes,
  #   so there is no emitted pattern to assert on. Needs a judge, or belongs to
  #   the docs rather than the skill.
  # - Peer-range guidance for library authors. Advice about npm's resolution
  #   behavior, not MapLibre code a model emits. Out of the deterministic family
  #   and arguably out of the skill's audience.
  # - Vite ?worker&url. Verified 2026-08-21 that upstream docs already cover this
  #   correctly and the migration guide correctly defers to them; no gap to teach.
  # =========================================================================
