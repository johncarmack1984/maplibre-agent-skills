description: Evals for the maplibre-fonts-glyphs skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-fonts-glyphs/SKILL.md

tests:
  - description: explicit — omitted glyphs field, text renders in wrong font
    vars:
      prompt:
        "My MapLibre GL JS stylesheet has no `glyphs` property set at all, and
        my symbol layers have `text-font` set to a font name. Text labels are
        showing up, but in a generic font, not the one I specified. Is this a
        bug I need to fix, or expected behavior? What's actually happening?"
    assert:
      - type: icontains
        value: '5.11'
      - type: llm-rubric
        value:
          'Correctly states this is expected, documented behavior on MapLibre GL
          JS >= 5.11.0 (PR #4564), not a bug: omitting `glyphs` entirely is a
          first-class local-fonts mode where `text-font` is resolved as a
          cascading list of local/system or web fonts, the same way a browser
          resolves a CSS font-family list. Must explain that the font shown is a
          generic/system fallback because the named font is not actually
          available as a local/web font on this browser/OS, and that supplying a
          real `glyphs` URL (or loading the font as a real web font via
          @font-face) is what would make the specified font render. Must NOT
          claim this is an error, that the stylesheet is invalid, or that
          MapLibre requires a `glyphs` property to render text at all.'

  - description: implicit — offline/local fonts on MapLibre Native, not GL JS
    vars:
      prompt:
        "I'm building an offline map app with MapLibre Native on Android and
        want labels to render in local device fonts without running a glyphs
        server. What's the right way to configure this?"
    assert:
      - type: icontains
        value: 'font-faces'
      - type: llm-rubric
        value:
          "Recommends MapLibre Native's `font-faces` property (Android >=
          11.13.0), which maps text-font names to local font files with explicit
          Unicode ranges — NOT the GL JS pattern of omitting the `glyphs` field,
          which is GL JS-only and not supported on Native (maplibre-native#165
          is still open). An answer that tells the user to simply omit `glyphs`
          from their Native stylesheet, or otherwise conflates the two SDKs'
          local-font mechanisms, FAILS even if the rest of the answer is
          reasonable."

  - description: anti-pattern — porting a Native font-faces config to GL JS
    vars:
      prompt:
        "I have a working `font-faces` config in my MapLibre Native app's
        stylesheet that renders local fonts offline with explicit Unicode ranges
        per file. I'm now building a MapLibre GL JS web app and want the same
        offline-font behavior — can I copy the same `font-faces` config into my
        GL JS stylesheet?"
    assert:
      - type: icontains
        value: '6.7'
      - type: llm-rubric
        value:
          'Says yes for MapLibre GL JS >= 6.7.0, which supports the same
          `font-faces` style property (and `map.setFontFaces`). Says that each
          `url` must be one the browser can fetch, because GL JS loads the font
          files through the browser, so the device file paths from the Native
          app must become files the web app serves. Must NOT claim that GL JS
          does not support `font-faces`.'

  - description: explicit — right-to-left Arabic and Hebrew labels on GL JS 6
    vars:
      prompt:
        'My MapLibre GL JS 6 map has Arabic and Hebrew place names. What do I
        need to set up so those labels read right-to-left with the Arabic
        letters joined correctly?'
    assert:
      - type: icontains
        value: '6.9'
      - type: llm-rubric
        value:
          'States that MapLibre GL JS 6.9.0 and later shape Arabic and lay out
          right-to-left text by themselves, so a current 6.x release needs no
          extra setup for this, and that `setRTLTextPlugin` is deprecated as of
          6.9.0. Must NOT present loading a right-to-left text plugin as
          required on GL JS 6.9.0 or later.'

  - description: implicit — Devanagari labels drawn letter by letter
    vars:
      prompt:
        'Hindi labels on my MapLibre GL JS map come out wrong: vowel signs and
        conjuncts land in the wrong place, as if each letter were drawn on its
        own. My style has a glyphs URL that serves Noto Sans Devanagari. How do
        I fix it?'
    assert:
      - type: icontains
        value: '6.15'
      - type: llm-rubric
        value:
          "Says current MapLibre GL JS draws Devanagari correctly: upgrading to
          6.15.0 or later fixes it (6.7.0 and 6.9.0 began drawing complex
          scripts with the browser, and 6.15.0 draws every Devanagari letter
          that way even when the style has a glyphs URL), and a specific font
          can be pinned for Devanagari with the style's `font-faces` property
          (GL JS 6.7.0 or later). Must NOT say this is a limitation of MapLibre
          with no fix."

  - description: negative — out-of-scope question about hillshade/terrain layers
    vars:
      prompt:
        'How do I add a hillshade layer from a raster-dem source to my MapLibre
        GL JS style?'
    assert:
      - type: not-icontains
        value: 'glyphs'
      - type: llm-rubric
        value:
          'Answers the hillshade/terrain question directly: adds a raster-dem
          source and a hillshade layer type, referencing that source. Grade the
          substance of the answer, not its completeness. FAILS only if the
          response is derailed into font/glyph configuration topics presented as
          if they were relevant to hillshade or terrain layers.'
