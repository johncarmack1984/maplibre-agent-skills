# Evals for the maplibre-terrain-patterns skill.

description: Evals for the maplibre-terrain-patterns skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - id: cerebras:gpt-oss-120b
    label: cerebras-gpt-oss

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-terrain-patterns/SKILL.md
  options:
    provider: cerebras:gpt-oss-120b

tests:
  - description: explicit — client-side hypsometric tint (color-relief layer, GL JS 5.6+)
    vars:
      prompt: >
        I have terrain tiles as a raster-dem source in MapLibre GL JS and I
        want to color the map by elevation ranges (a hypsometric tint) directly
        client-side — blues at sea level through greens and browns to white
        peaks — without pre-rendering colored raster tiles. What layer type do
        I use and how do I configure the color ramp?
    assert:
      - type: icontains
        value: 'color-relief'
      - type: llm-rubric
        value: >
          Recommends MapLibre's color-relief layer type (added in GL JS 5.6),
          which colors terrain client-side from a raster-dem source using a
          color-relief-color paint property with an interpolate expression on
          ["elevation"]. An answer that claims client-side elevation coloring
          is not possible in MapLibre, or that invents a different layer type
          or property name, or that only offers pre-rendered raster tiles or a
          hillshade workaround, FAILS.

  - description: implicit — runtime contour generation, off-the-shelf vs DIY
    vars:
      prompt: >
        I want contour lines on my MapLibre GL JS map, generated at runtime
        from a raster-dem elevation source, rather than pre-rendering a
        separate vector contour tileset ahead of time. Is this possible, and
        how would I approach it?
    assert:
      - type: llm-rubric
        value: >
          Recommends an existing, purpose-built runtime contour-generation
          tool/library that integrates with MapLibre GL JS (e.g. by
          registering a custom protocol or source that derives vector contour
          tiles on the fly from a raster-dem source), so the developer adds a
          few lines of setup rather than implementing the pipeline themselves.
          An answer FAILS if it does not mention that such an off-the-shelf
          solution exists and instead directs the developer to build the
          pipeline from scratch (e.g. manually decoding raster-dem pixels,
          implementing a marching-squares/isoline algorithm, hand-rolling Web
          Worker tiling, or using generic geometry libraries like d3-contour
          or turf.js as the primary approach) without surfacing that a
          ready-made library already solves this.

  - description: anti-pattern — stacking hillshade layers for multi-directional shading
    vars:
      prompt: >
        My single hillshade layer in MapLibre GL JS looks harsh, how do I fix it?
    assert:
      # Deterministic tripwire: hillshade-method shipped in GL JS 5.5.0 (2025),
      # post-cutoff — baseline endorses stacking (the only pre-5.5 technique).
      - type: icontains
        value: 'hillshade-method'
      - type: llm-rubric
        value: >
          Distinguishes between harshness caused by incorrect encoding or 
          configuration values and harshness from the illumination method.
          Steers the user away from stacking multiple hillshade layers and
          recommends the hillshade-method paint property (e.g.
          "multidirectional", added in GL JS 5.5) on a single hillshade layer,
          noting that stacked hillshade layers add draw passes / GPU cost.
          An answer that endorses the four-layer stack as the right approach
          without mentioning hillshade-method FAILS.

  - description: negative — out-of-scope question about vector tile sources
    vars:
      prompt: >
        I want to add OpenStreetMap road and building data to my MapLibre map.
        What tile source should I use and how do I reference it in my style?
    assert:
      - type: llm-rubric
        value: >
          Correctly answers the question asked: recommends one or more vector
          tile sources for OSM data (any reasonable option — OpenFreeMap,
          MapTiler, OpenMapTiles, Stadia, self-hosted Martin or tileserver-gl —
          counts) and shows how to reference a vector source and source-layer
          in the style. PASS as long as the substance is about vector tiles.
          FAILS only if it claims a raster-dem source, terrain, or hillshade
          configuration is needed for OSM roads and buildings, or answers a
          different question entirely.
