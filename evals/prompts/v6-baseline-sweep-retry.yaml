# v6 baseline sweep — retry only the tests that timed out in prior runs
#
# The full sweep's first two attempts got tests 0-7 (items 1, 2, 4a, 4b)
# fully complete (5 repeats each). Tests 8-11 (item 4c, item 5, item 6) hit
# the Groq TPM rate limit wall. Retry only those 4 tests.
#
# Run with:
#   npm run eval -- --config evals/prompts/v6-baseline-sweep-retry.yaml \
#     --repeat 5 --delay 10000 --no-cache -j 1 \
#     --output evals/results/local/v6-baseline-sweep-retry.csv

description: v6 baseline sweep — retry only items 4c, 5a, 5b, 6a

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - id: groq:openai/gpt-oss-120b
    label: groq-gpt-oss
    config:
      temperature: 0
      max_tokens: 8192

evaluateOptions:
  delay: 10000

defaultTest:
  vars:
    injectSkill: false

tests:
  # Item 4c — retained from full config, byte-identical
  - description: 'item4c — handle missing icon via the event system'
    vars:
      prompt:
        "Handle the case where an icon is requested by a MapLibre GL JS style
        but not present, using the map's event system."
    assert:
      - type: icontains
        value: 'setMissingStyleImageResolver'

  # Item 5a — CommonJS require()
  - description: 'item5a — load maplibre-gl from a CommonJS Node script'
    vars:
      prompt:
        'Write a Node.js script using CommonJS that loads the maplibre-gl
        package and prints its version.'
    assert:
      - type: not-regex
        value: '=\s*require\(\s*.maplibre-gl'

  # Item 5b — require() fails
  - description: 'item5b — require() fails, why'
    vars:
      prompt:
        "In Node, `require('maplibre-gl')` throws. What's the current supported
        way to load the package outside a bundler?"
    assert:
      - type: icontains
        value: 'import'

  # Item 6a — map.transform removal
  - description: 'item6a — read camera state for custom math'
    vars:
      prompt:
        'In MapLibre GL JS, I need the map camera state (center, zoom, bearing,
        pitch, and the projection matrix) to do some custom math. Show me how to
        read it.'
    assert:
      - type: not-icontains
        value: 'map.transform'
